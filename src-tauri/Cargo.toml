[package]
name = "tariqi"
version = "0.1.2"
description = "Management software for Algerian driving schools"
authors = ["Tariqi"]
edition = "2021"
rust-version = "1.77.2"
# Required because the crate has a second binary (`seed`): without this the
# Tauri CLI cannot tell which one is the application.
default-run = "tariqi"

[lib]
# Tauri 2 keeps the app in a library so the same code can target desktop and
# mobile; main.rs is a thin binary wrapper around it.
name = "tariqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite. WAL plus synchronous=FULL on money writes: these machines lose power
# mid-operation and a lost receipt is worse than a slow one.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "chrono",
] }
# "time": the backup code waits for Windows to release a file without
# blocking the thread (backup::retry).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.5"
# Updates: checked only when the PC happens to be online, installed only when
# the owner says so, and verified against the public key in tauri.conf.json.
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# The one-code lock (src/license): the code is checked against an Argon2id
# hash, and kept on the PC encrypted with Windows DPAPI so a copy elsewhere
# cannot read it.
argon2 = "0.5.3"
# Only for the random salt in src/bin/unlock_hash.rs and the tests.
password-hash = { version = "0.5.0", features = ["getrandom"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Integration tests in tests/ link the library but not its dependencies, so
# the crash-consistency test needs its own handle on sqlx.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
] }

[profile.release]
# The installer travels by USB stick and slow links to Algerian schools, so
# size genuinely matters commercially. See docs/03-STACK.md, Decision 1.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Argon2 unoptimised takes seconds per check; a debug build checks the lock at
# every start.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
